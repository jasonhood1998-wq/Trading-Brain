name: automate_strategy_b_trading212.py

on:
  schedule:
    # 13:30 UTC to 13:55 UTC (Covers 9:30 AM EDT market open)
    - cron: '30-59/5 13 * * 1-5'
    # 14:00 UTC to 20:55 UTC (Covers full trading day for EST and EDT)
    - cron: '*/5 14-20 * * 1-5'
  workflow_dispatch:

# Prevents simultaneous runs from colliding on git push
concurrency:
  group: strategy-b-trading
  cancel-in-progress: false

jobs:
  run-automate_strategy_b_trading212:
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run automate_strategy_b_trading212.py
        env:
          TRADING212_API_KEY: ${{ secrets.TRADING212_API_KEY }}
          TRADING212_API_SECRET: ${{ secrets.TRADING212_API_SECRET }}
        run: python automate_strategy_b_trading212.py

      - name: Upload Trade & Audit Log Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy-b-logs
          path: |
            Strategy_B_Trade_Log.csv
            Strategy_B_Scan_Audit.csv
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit and Push Updated Logs
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add Strategy_B_Trade_Log.csv Strategy_B_Scan_Audit.csv 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update trade and audit logs [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No new log entries to commit."
          fi
